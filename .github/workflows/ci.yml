name: CI

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    name: Windows / MSVC (core + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # windows-latest ships Visual Studio 2026; the preset targets VS 2022 for local builds.
      - name: Configure
        run: cmake --preset windows-msvc -G "Visual Studio 18 2026" -DAMP_BUILD_APP=OFF
      - name: Build
        run: cmake --build --preset windows-msvc --parallel
      - name: Test
        run: ctest --preset windows-msvc

  ubuntu-gcc:
    name: Ubuntu / GCC (core + tests + GUI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev python3
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux --parallel
      - name: Test
        run: ctest --preset linux

  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          find core app tests bench \( -name '*.cpp' -o -name '*.hpp' \) -print 2>/dev/null | xargs clang-format --dry-run --Werror
